<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam Mirror</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.video-box{
    position:relative;
    overflow:hidden;
    border-radius:20px;
}

video{
    width:100%;
    border-radius:20px;

    /* kamera mirror/inverted */
    transform:scaleX(-1);

    background:black;
}

.status{
    position:absolute;
    top:10px;
    left:10px;
    background:red;
    padding:6px 12px;
    border-radius:30px;
    font-size:14px;
    display:none;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.start{
    background:#00c853;
    color:white;
}

.stop{
    background:#d50000;
    color:white;
}

.photo{
    background:#2962ff;
    color:white;
}

.gallery{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    border:2px solid #333;
}
</style>
</head>
<body>

<div class="container">

    <h1>Webcam Mirror Camera</h1>

    <div class="video-box">
        <div class="status" id="status">● CAMERA ACTIVE</div>

        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button class="start" onclick="startCamera()">
            Aktifkan Kamera
        </button>

        <button class="photo" onclick="takePhoto()">
            Ambil Foto
        </button>

        <button class="stop" onclick="stopCamera()">
            Matikan Kamera
        </button>
    </div>

    <div class="gallery" id="gallery"></div>

</div>

<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const gallery = document.getElementById("gallery");
const statusText = document.getElementById("status");

let stream;
let autoCapture;

async function startCamera(){

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        video.srcObject = stream;

        statusText.style.display = "block";

        // auto foto tiap 5 detik
        autoCapture = setInterval(() => {
            takePhoto();
        }, 5000);

    }catch(err){

        alert("Izin kamera ditolak!");

    }
}

function stopCamera(){

    clearInterval(autoCapture);

    if(stream){
        stream.getTracks().forEach(track => track.stop());
    }

    statusText.style.display = "none";
}

function takePhoto(){

    // mirror hasil foto juga
    ctx.save();

    ctx.scale(-1,1);

    ctx.drawImage(video,-640,0,640,480);

    ctx.restore();

    const image = canvas.toDataURL("image/png");

    // tampil ke galeri website
    const img = document.createElement("img");

    img.src = image;

    gallery.prepend(img);

    // download otomatis
    const link = document.createElement("a");

    link.href = image;

    link.download = "foto_" + Date.now() + ".png";

    link.click();
}
</script>

</body>
</html>
