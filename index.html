<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Upload System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.notice{
    background:#ff9800;
    color:black;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-weight:bold;
}

.video-box{
    overflow:hidden;
    border-radius:20px;
}

video{
    width:100%;
    border-radius:20px;
    transform:scaleX(-1);
    background:black;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.start{
    background:#00c853;
    color:white;
}

.capture{
    background:#2962ff;
    color:white;
}

.gallery{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
}

.gallery img{
    width:100%;
    border-radius:12px;
}
</style>
</head>
<body>

<div class="container">

    <h1>Camera Upload System</h1>

    <div class="notice">
        Dengan menekan tombol aktifkan kamera,
        pengguna setuju bahwa foto akan diupload
        ke server admin.
    </div>

    <div class="video-box">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">

        <button class="start" onclick="startCamera()">
            Aktifkan Kamera
        </button>

        <button class="capture" onclick="takePhoto()">
            Ambil & Upload Foto
        </button>

    </div>

    <div class="gallery" id="gallery"></div>

</div>

<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const gallery = document.getElementById("gallery");

let stream;

async function startCamera(){

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:true
        });

        video.srcObject = stream;

    }catch(err){

        alert("Izin kamera ditolak!");

    }
}

async function takePhoto(){

    ctx.save();

    ctx.scale(-1,1);

    ctx.drawImage(video,-640,0,640,480);

    ctx.restore();

    const imageData = canvas.toDataURL("image/png");

    // tampil di galeri website
    const img = document.createElement("img");
    img.src = imageData;

    gallery.prepend(img);

    // upload ke server
    try{

        const response = await fetch("https://YOUR-SERVER/upload",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                image:imageData
            })

        });

        if(response.ok){

            alert("Foto berhasil diupload!");

        }else{

            alert("Upload gagal!");

        }

    }catch(err){

        alert("Server tidak tersedia!");

    }
}
</script>


</body>
</html>
